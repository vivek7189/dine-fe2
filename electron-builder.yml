appId: com.dineopen.desktop
productName: DineOpen POS
directories:
  output: dist-electron
files:
  - out/**/*
  - electron/**/*
  - package.json
asarUnpack:
  - "node_modules/better-sqlite3/**/*"
extraMetadata:
  main: electron/main.js

publish:
  provider: github
  owner: vivek7189
  repo: dine-fe2

win:
  icon: electron/icons/icon.ico
  target:
    - target: nsis
      arch:
        - x64
        - ia32
mac:
  icon: electron/icons/icon.icns
  target:
    # Two separate DMGs/zips (Apple Silicon + Intel) instead of a universal binary.
    # The universal build merges both ASARs and trips @electron/universal's
    # "pattern is too long" bug on deep node_modules paths — separate arches avoid it.
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  category: public.app-category.business
  identity: "Vivek Kumar (934QP9KSRD)"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: electron/entitlements.mac.plist
  entitlementsInherit: electron/entitlements.mac.plist
  artifactName: "${productName}-${version}-${arch}.${ext}"
afterSign: scripts/notarize.js
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
linux:
  target: AppImage
  category: Office
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
